name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.banco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        banco: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integra_testes
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, fileinfo, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        if: matrix.banco == 'sqlite'
        run: vendor/bin/pint --test

      - name: Testes em SQLite
        if: matrix.banco == 'sqlite'
        run: php artisan test

      - name: Testes em PostgreSQL
        if: matrix.banco == 'pgsql'
        run: php artisan test -c phpunit.pgsql.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Tipos (TypeScript)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: npm run build
